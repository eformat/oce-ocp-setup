# The postgresclusters CRD is ~1.4 MB: client-side apply cannot create it (the
# last-applied-configuration annotation would exceed the 256 KiB metadata
# limit), so Argo must use server-side apply for this resource. The
# operators stage may need the same treatment for other large CRDs if OLM
# packages ever return to the OCP 5.0 catalogs.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresclusters.postgres-operator.crunchydata.com
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
